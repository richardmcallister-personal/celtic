<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Celtic</title>
<style>
:root{--bg:#f3f1ee;--paper:#fff;--ink:#151515;--muted:#5c5c5c;--green:#00703c}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--paper:#1e1e20;--ink:#f3f1ee;--muted:#b5b5b5;--green:#3fbf7f}}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
main{background:var(--paper);border-radius:12px;padding:24px;max-width:420px;border-top:6px solid var(--green)}
h1{margin:0 0 8px;font-size:28px}p{margin:0;color:var(--muted)}
</style>
</head>
<body><main><h1>Celtic</h1><p>A fan-built club site, in progress.</p></main></body>
</html>
