<script>
(function(){
MU.nav('Players'); MU.checked("archive",document.getElementById("stamp"),"Archive built");
var $=function(i){return document.getElementById(i)}, E=MU.esc;
function dt(d,o){return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",o||{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})}
function rc(m){return m.gf>m.ga?"rw":m.gf<m.ga?"rl":"rd"}
function score(m){return '<span class="'+rc(m)+'">'+m.gf+'–'+m.ga+'</span>'+(m.pw!=null?' <small>'+(m.pw?"won":"lost")+' on pens</small>':'')}
var qs=new URLSearchParams(location.search), P=qs.get("p"), Q=qs.get("q");
Promise.all([fetch("/history/players.json").then(function(r){return r.json()}),fetch("/history/player_goals.json").then(function(r){return r.json()})]).then(function(a){var H=a[0], G=a[1], p=null;
  if(P)p=H.filter(function(h){return h.slug===P})[0];
  if(!p&&Q){var sn=MU.slug(Q.split(" ").pop()), ini=/^[A-Z]\./.test(Q)?Q[0].toLowerCase():null; p=H.filter(function(h){return MU.slug(h.name.split(" ").pop())===sn&&(!ini||h.name[0].toLowerCase()===ini)}).sort(function(x,y){return (y.last||"").localeCompare(x.last||"")})[0]}
  if(!p){$("top").innerHTML='<p class="sub">Player not found in the archive. <a href="/players/">See every player</a>.</p>';return}
  document.title="Celtic · "+p.name; $("from").innerHTML="Player<span>"+E(p.name)+"</span>";
  var gl=G[p.slug]||[], f=[]; if(p.pos)f.push(["Position",E(p.pos)]); if(p.career)f.push(["At Celtic",E(p.career)]); if(!p.career&&p.first)f.push(["Goals on record",dt(p.first)+" to "+dt(p.last)]);
  $("top").innerHTML='<div class="wikip" id="wp"></div><h2>'+E(p.name)+'</h2><div class="h2h">'+(p.apps!=null?'<div><b>'+p.apps+'</b><span>Appearances</span></div>':'')+'<div class="w"><b>'+(p.goals!=null?p.goals:gl.length)+'</b><span>'+(p.goals!=null?"Goals":"Goals on record")+'</span></div></div><div class="facts">'+f.map(function(x){return '<div><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>'}).join("")+'</div>';
  fetch("/history/managers.json").then(function(r){return r.json()}).then(function(M){var s=M.filter(function(x){return x.slug===p.slug}); if(!s.length)return; var d=document.createElement("div"); d.innerHTML='<div class="k">As manager</div><div class="v"><a href="/manager/?m='+s[0].slug+'">'+s.map(function(x){return E(x.career)}).join(", ")+'</a></div>'; document.querySelector("#top .facts").appendChild(d)});
  if(gl.length){$("goals").hidden=false; $("goals").innerHTML='<h2>Goals on record</h2><p class="sub" style="margin:0 0 8px">'+gl.length+(p.goals!=null?' of '+p.goals:'')+' listed. Scorers are nearly complete from 2000 on and sparse before that.</p><table class="mu"><thead><tr><th>Date</th><th>Opponent</th><th>Minute</th><th>Competition</th></tr></thead><tbody>'+gl.slice().reverse().map(function(g){return '<tr><td>'+dt(g.d)+'</td><td>'+MU.club(g.o,14,"",g.d)+'</td><td>'+(g.m?E(g.m)+"′":"")+(g.p?" (pen)":"")+'</td><td>'+E(({LG:"League",SC:"Scottish Cup",LC:"League Cup",EC:"European Cup / Champions League",EL:"UEFA Cup / Europa League",CWC:"Cup Winners\' Cup",FC:"Fairs Cup",ECL:"Conference League",OTH:"Other cup",GC:"Glasgow Cup",CH:"Charity Cup",WAR:"Wartime"})[g.c]||"")+'</td></tr>'}).join("")+'</tbody></table>'}
  if(p.wiki)fetch("/wiki?title="+encodeURIComponent(p.wiki)).then(function(r){return r.json()}).then(function(w){if(w&&w.extract){$("wp").innerHTML=(w.thumbnail?'<img src="'+E(typeof w.thumbnail==="string"?w.thumbnail:w.thumbnail.source)+'" alt="" loading="lazy">':'')+'<p style="font-size:14px;margin:0 0 10px">'+E(w.extract)+' <a href="https://en.wikipedia.org/wiki/'+encodeURIComponent(p.wiki)+'" target="_blank" rel="noopener">Wikipedia ↗</a></p>'}}).catch(function(){});
});
})();
