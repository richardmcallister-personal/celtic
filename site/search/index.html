</head><body><a class="skip" href="#main-content">Skip to main content</a><div class="wrap">
<header class="mu">
  <a class="brand" href="/"><img src="/assets/crest-88.png" alt="" width="44" height="44" decoding="async"><h1><small>A fan-built club archive</small>Celtic</h1></a>
  <div class="from" id="from">Search<span></span></div>
</header>
<nav class="munav" aria-label="Sections"></nav>
<main id="main-content" tabindex="-1">

<div class="sheet"><h2>Search</h2><div class="filters"><input id="q" placeholder="Players, opponents, managers…" aria-label="Search" style="flex:1"></div><div id="out"></div></div>

</main>
<footer class="mu"><span id="stamp"></span> Results, managers, honours and player totals: Wikipedia (CC BY-SA). Live data: API-Football. Crests, logos and kit images: <a href="/kits/#credits">sources and credits</a>. An independent fan site, not connected with Celtic FC.</footer>
</div>
<script src="/mu.js"></script>
<script>
(function(){
MU.nav(''); MU.checked("archive",document.getElementById("stamp"),"Archive built");
var $=function(i){return document.getElementById(i)}, E=MU.esc;
function dt(d,o){return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",o||{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})}
function rc(m){return m.gf>m.ga?"rw":m.gf<m.ga?"rl":"rd"}
function score(m){return '<span class="'+rc(m)+'">'+m.gf+'–'+m.ga+'</span>'+(m.pw!=null?' <small>'+(m.pw?"won":"lost")+' on pens</small>':'')}
function ven(h){return h===1?"H":h===-1?"A":"N"}
function scs(m){var a=(m.sc||[]).map(function(s){return E(s[0])+(s[1]?" "+E(s[1])+"′":"")+(s[2]==="p"?" (pen)":s[2]==="og"?" (og)":"")}); return a.join(", ")}
function wl(t){return t.w+"W "+t.d+"D "+t.l+"L"}
function pct(t){return t.p?Math.round(100*t.w/t.p):0}

function go(){var q=$("q").value.trim(); if(q.length<2){$("out").innerHTML="";return} MU.search(q,60).then(function(L){$("out").innerHTML=L.length?'<div class="hits" style="display:grid;gap:8px">'+L.map(function(e){return MU.hit(e,q)}).join("")+'</div>':'<p class="sub">Nothing matches.</p>'})}
$("q").value=new URLSearchParams(location.search).get("q")||""; $("q").addEventListener("input",go); go();

})();
</script></body></html>
