<style>
.ofhero{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 12px;flex-wrap:wrap}

.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.seg button{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;cursor:pointer;min-height:36px}
.seg button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.ctl select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;min-height:36px}
.ctlgrp{display:grid;gap:10px}
.ctlgrp .lab{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
@media (min-width:900px){.sticky{position:sticky;top:var(--mast,0px);z-index:5}}
.wdl{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--tint);margin:4px 0 6px}
.wdl i{display:block} .wdl .w{background:var(--win)} .wdl .d{background:var(--draw)} .wdl .l{background:var(--loss)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.vcard{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--paper)}
.vcard h3{margin:0 0 2px;font-size:15px} .vcard .n{font-size:13px;color:var(--muted)} .vcard .big{font-size:22px;font-weight:700;margin:6px 0 0}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart .ax{stroke:var(--rule);stroke-width:1} .chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .ln{fill:none;stroke:var(--red-ink);stroke-width:2} .chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .hit{fill:transparent} .chart .dot{fill:var(--red-ink)}
.tip{font-size:13px;min-height:2.6em;margin:6px 0 0}
.dec{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px}
.dec .wdl{margin:0}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.three .sheet{margin-top:0}
ol.top{margin:0;padding:0;list-style:none} ol.top li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px} ol.top li:last-child{border-bottom:0} ol.top small{grid-column:1/-1;color:var(--muted);font-size:12px}
ol.top a{color:inherit} 
.runs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.runs div{border:1px solid var(--rule);border-radius:10px;padding:10px 12px} .runs b{display:block;font-size:22px} .runs span{font-size:12px;color:var(--muted)} .runs small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
td a.gl{color:inherit;font-weight:600;text-decoration:none;border-bottom:1px solid var(--rule)} td a.gl:hover{border-color:currentColor}
.rw{color:var(--win)} .rl{color:var(--loss)} .rd{color:var(--muted)}

.gscore{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:6px 0 10px;text-align:center}
.gscore .t{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.gscore .s{font-size:40px;font-weight:700;line-height:1}

.facts2>div{border:1px solid var(--rule);border-radius:10px;padding:10px 12px} .facts2 .k{font-size:12px;color:var(--muted)} .facts2 .v{font-size:14px;margin-top:2px}
ul.gs{list-style:none;margin:0;padding:0} ul.gs li{padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px} ul.gs li:last-child{border-bottom:0}

<script>
(function(){
MU.nav("Results"); MU.checked("archive",document.getElementById("stamp"),"Archive built");
var $=function(i){return document.getElementById(i)}, E=MU.esc;
function dt(d){return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})}
function rc(m){return m.gf>m.ga?"W":m.gf<m.ga?"L":"D"}
function line(m,o){var r=m.h===-1?MU.nm(o||m.o,m.d)+' '+m.ga+'–'+m.gf+' Celtic':'Celtic '+m.gf+'–'+m.ga+' '+MU.nm(o||m.o,m.d); return r+(m.pw!=null?' <small>('+(m.pw?'won':'lost')+' on pens)</small>':'')+(m.aet?' <small>aet</small>':'')}
function tally(L){var t={p:0,w:0,d:0,l:0,gf:0,ga:0}; L.forEach(function(m){t.p++; t.gf+=m.gf; t.ga+=m.ga; t[rc(m).toLowerCase()]++}); return t}
function bar(t){return t.p?'<div class="wdl" role="img" aria-label="'+t.w+' won, '+t.d+' drawn, '+t.l+' lost"><i class="w" style="width:'+(100*t.w/t.p)+'%"></i><i class="d" style="width:'+(100*t.d/t.p)+'%"></i><i class="l" style="width:'+(100*t.l/t.p)+'%"></i></div>':''}
function gl(m,txt){return '<a class="gl" href="/game/?i='+m.i+'">'+txt+'</a>'}
var i=+new URLSearchParams(location.search).get("i");

  if(!m){$("top").innerHTML='<p class="sub">Game not found. <a href="/results/">Every result</a>.</p>'; return}
  var of=m.o==="Rangers", r=rc(m), home=m.h!==-1;
  document.title="Celtic · "+(home?"Celtic "+m.gf+"–"+m.ga+" "+m.o:m.o+" "+m.ga+"–"+m.gf+" Celtic")+" · "+m.d.slice(0,4);
  $("from").innerHTML=(of?"Old Firm":"Game")+"<span>"+dt(m.d)+"</span>";
  var A=home?["Celtic",m.gf]:[m.o,m.ga], B=home?[m.o,m.ga]:["Celtic",m.gf];
  function team(n){return '<div class="t">'+(n==="Celtic"?'<img src="/assets/crest-88.png" alt="" width="56" height="56">':MU.crest(n,56))+'<span>'+(n==="Celtic"?"Celtic":'<a href="'+(of?'/oldfirm/':'/opponent/?o='+MU.slug(n))+'">'+MU.nm(n,m.d)+'</a>')+'</span></div>'}
  var f=[["Competition",MU.compRow(m)+E(CN[m.c]||m.t)+(m.r&&!/^league$/i.test(m.r)?" · "+E(m.r):"")],["Season",'<a href="/results/?season='+m.y+'">'+sea(m.y)+'</a>'],["Venue",E(m.v||"–")+(m.h===0?" (neutral)":"")]];
  if(m.att)f.push(["Attendance",String(m.att)]); if(m.ref)f.push(["Referee",E(m.ref)]); if(m.mn)f.push(["Celtic manager",m.ms?'<a href="/manager/?m='+m.ms+'">'+E(m.mn)+'</a>':E(m.mn)]);
  $("top").innerHTML='<div class="gscore">'+team(A[0])+'<div><div class="s">'+A[1]+'–'+B[1]+'</div><div class="sub" style="margin:4px 0 0">'+(r==="W"?"Celtic won":r==="L"?"Celtic lost":"Draw")+(m.aet?" after extra time":"")+(m.pw!=null?(m.pw?", won ":", lost ")+(m.pens?m.pens[0]+"–"+m.pens[1]:"")+" on penalties":"")+'</div></div>'+team(B[0])+'</div><div class="facts2">'+f.map(function(x){return '<div><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>'}).join("")+'</div>'+(m.rep?'<p class="sub" style="margin:12px 0 0"><a href="'+E(m.rep)+'" target="_blank" rel="noopener">Match report ↗</a></p>':'');
  if(m.gf){$("goals").hidden=false; var sc=m.sc||[];
    $("goals").innerHTML='<h2>Celtic goals</h2>'+(sc.length?'<ul class="gs">'+sc.map(function(s){return '<li>'+(s[1]?E(s[1])+"′ ":"")+(s[0]==="Own goal"?"Own goal":'<a href="/player/?q='+encodeURIComponent(s[0])+'">'+E(s[0])+'</a>')+(s[2]==="p"?" (pen)":"")+'</li>'}).join("")+'</ul>'+(sc.length<m.gf?'<p class="sub" style="margin:6px 0 0">'+(m.gf-sc.length)+' of the goals have no scorer on record.</p>':''):'<p class="sub" style="margin:0">No scorers on record for this game. Wikipedia names few scorers before 2000.</p>')}
  var L=M.filter(function(x){return x.o===m.o&&["LG","SC","LC","EC","EL","CWC","FC","ECL","OTH","GC","CH","WAR"].indexOf(x.c)>=0}), k=L.indexOf(m), before=L.slice(0,k+1), t={p:0,w:0,d:0,l:0};
  before.forEach(function(x){t.p++; t[rc(x).toLowerCase()]++});
  $("h2").hidden=false; $("h2").innerHTML='<h2>Head to head after this game</h2><p style="margin:0 0 6px">Meeting '+(k+1)+' of '+L.length+' between the clubs on record.</p>'+bar(t)+'<p class="sub" style="margin:0">Celtic '+t.w+' wins, '+t.d+' draws, '+t.l+' '+E(m.o)+MU.ast(m.o,m.d)+' wins, counting every competition. '+(of?'<a href="/oldfirm/">Old Firm explorer</a>':'<a href="/opponent/?o='+MU.slug(m.o)+'">Every game against '+E(m.o)+'</a>')+'</p>';
  var p=L[k-1], n=L[k+1], ps=M.filter(function(x){return x.i===i-1})[0], ns=M.filter(function(x){return x.i===i+1})[0];
  $("nav").hidden=false; $("nav").innerHTML='<h2>More games</h2><div class="pn"><span>'+(p?'← Previous v '+E(m.o)+': '+gl(p,dt(p.d)+', '+line(p)):'')+'</span><span>'+(n?'Next v '+E(m.o)+': '+gl(n,dt(n.d)+', '+line(n))+' →':'')+'</span></div><div class="pn" style="margin-top:10px"><span class="sub">'+(ps?'← Celtic\'s game before: '+gl(ps,dt(ps.d)+', '+line(ps)):'')+'</span><span class="sub">'+(ns?'Celtic\'s next game: '+gl(ns,dt(ns.d)+', '+line(ns))+' →':'')+'</span></div>';
});
